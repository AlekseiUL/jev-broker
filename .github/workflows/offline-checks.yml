name: Offline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Offline / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install MCP Python SDK for offline compatibility test
        run: python -m pip install --disable-pip-version-check 'mcp==2.0.0'
      - name: Build, vet and test without OpenRouter
        env:
          JEV_HERMES_PYTHON: python
        run: |
          go vet ./...
          go build -o "$RUNNER_TEMP/jev-broker" ./cmd/jev-broker
          go test -race -count=1 ./...
          python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Check public inventory and scan files, history and archive
        run: |
          python scripts/release_check.py --require-standalone-git
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact=100 --no-banner --log-level error .
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact=100 --no-banner --log-level error .
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -xf - -C "$archive_dir"
          python "$archive_dir/scripts/release_check.py"
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact=100 --no-banner --log-level error "$archive_dir"
